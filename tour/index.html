  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "name": "Arli",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Cross-platform",
        "description": "An arity-driven Forth-like Lisp dialect eliminating parentheses through parse-time arity tables, featuring Forth stack reflection and F-expressions.",
        "softwareRequirements": "Python, Go, or Modern Web Browser (WebAssembly/ESM)"
      },
      {
        "@type": "Course",
        "name": "A Tour of Arli",
        "description": "An interactive 20-lesson guide to mastering Arli, covering prefix syntax, recursion without parentheses, Forth stack combinators, and F-expressions.",
        "provider": {
          "@type": "Organization",
          "name": "Arli Project"
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Arli?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Arli (Arity-driven Lisp) is a minimalist Lisp dialect that combines prefix S-expressions with Forth data stack operations and Push-style exec stack metaprogramming, eliminating parentheses when operator arities are known."
            }
          },
          {
            "@type": "Question",
            "name": "How does Arli eliminate parentheses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Arli maintains a parse-time ArityTable. When an operator or function has a registered arity N, the parser greedily consumes the next N expressions without requiring outer parentheses. Recursive functions defined with defn or defn-rec register their arity before body parsing to enable parenthesis-free recursion."
            }
          },
          {
            "@type": "Question",
            "name": "How do F-expressions work in Arli instead of macros?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Arli uses first-class F-expressions (defn-fexpr) instead of traditional compile-time macros. F-expressions receive unevaluated AST forms directly at runtime and use the eval builtin to selectively evaluate expressions in the caller scope."
            }
          },
          {
            "@type": "Question",
            "name": "How are higher-order functions called in Arli?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Because dynamic parameter symbols have unknown arity at parse time, invoking dynamic function parameters requires explicit parentheses (e.g., (f (g 1 2))). Existing functions can be passed by value as quoted symbols (e.g., 'inc 'add) or anonymous closures."
            }
          }
        ]
      }
    ]
  }
  </script>
